version: '3.8'

services:
  # PRAMAAN AI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pramaan-backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - QDRANT_URL=qdrant
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION_NAME=pramaan
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - LOG_LEVEL=INFO
    depends_on:
      - qdrant
      - redis
    volumes:
      - ./uploads:/app/uploads
    networks:
      - pramaan-network
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: pramaan-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - pramaan-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: pramaan-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - pramaan-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  qdrant-storage:
  redis-data:

networks:
  pramaan-network:
    driver: bridge
